server {
  listen ${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The panel contains authenticated support data. Keep browser hardening at
  # the edge so it is applied consistently to HTML fallbacks and static files.
  # If VITE_API_URL changes, keep the API origins below synchronized.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://botsupport-production-e563.up.railway.app; media-src 'self' blob: https://botsupport-production-e563.up.railway.app; connect-src 'self' https://botsupport-production-e563.up.railway.app wss://botsupport-production-e563.up.railway.app; worker-src 'self' blob:; form-action 'self'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
