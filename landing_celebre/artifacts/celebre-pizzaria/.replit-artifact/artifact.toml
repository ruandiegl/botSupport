kind = "web"
previewPath = "/"
title = "CELEBRE Pizzaria"
version = "1.0.0"
id = "artifacts/celebre-pizzaria"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23141

[services.development]
run = "pnpm --filter @workspace/celebre-pizzaria run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/celebre-pizzaria", "run", "build" ]
serve = "static"
publicDir = "artifacts/celebre-pizzaria/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23141"
BASE_PATH = "/"
